name: Shellworks
description: 'Shellworks is a materials-science company that produces VIVOMER, a home-compostable,
  biodegradable alternative to conventional plastic made through a natural fermentation
  process from agricultural waste. VIVOMER runs on standard plastic-manufacturing equipment,
  is certified for food contact (FDA and EU 10/2011), and biodegrades without leaving
  microplastics or toxic residue. Shellworks supplies these sustainable packaging materials
  to consumer brands across the UK, EU, and US. Backed by Version One Ventures, the
  company was surfaced as a portfolio lead and added to the API Evangelist network. It
  is a B2B climate / materials supplier with no public API, developer portal, or SDK
  surface.'
